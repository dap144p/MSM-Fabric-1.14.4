plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

version = project.findProperty("build_version") ?: project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://repo.opencollab.dev/main/" }
    maven { url = "https://jitpack.io" }
}

loom {
    mixin {
        defaultRefmapName = "msm_fabric_1_21_11.refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation project(":msm-core")

    include(implementation("org.geysermc.mcprotocollib:protocol:1.21.11-1"))
    include(implementation("org.cloudburstmc:nbt:3.0.4.Final"))
    include(implementation("com.google.code.gson:gson:2.11.0"))
    include(implementation("net.raphimc:MinecraftAuth:5.0.0"))
    include(implementation("net.kyori:adventure-api:4.25.0"))
    include(implementation("net.kyori:adventure-key:4.25.0"))
    include(implementation("net.kyori:adventure-text-serializer-gson:4.25.0"))
    include(implementation("net.kyori:adventure-text-serializer-json-legacy-impl:4.25.0"))
    include(implementation("net.kyori:adventure-text-serializer-plain:4.25.0"))
    include(implementation("net.kyori:examination-api:1.3.0"))
    include(implementation("net.kyori:examination-string:1.3.0"))
    include(implementation("org.cloudburstmc.math:api:2.0"))
    include(implementation("org.cloudburstmc.math:immutable:2.0"))
    include(implementation("com.nukkitx.fastutil:fastutil-object-int-maps:8.5.3"))
    include(implementation("com.nukkitx.fastutil:fastutil-int-object-maps:8.5.3"))
    include(implementation("com.nukkitx.fastutil:fastutil-int-int-maps:8.5.3"))
    include(implementation("org.checkerframework:checker-qual:3.42.0"))
    include(implementation("com.github.steveice10:opennbt:1.3"))
}

sourceSets {
    main {
        java.srcDirs = [
            "src/main/java",
            "../src/main/java/dev/cylox/msm/automation",
            "../src/main/java/dev/cylox/msm/server"
        ]
        resources.srcDirs = ["src/main/resources"]
    }
    test {
        java.srcDirs = [
            "src/test/java",
            "../src/test/java/dev/cylox/msm/automation"
        ]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.named("jar") {
    dependsOn(":msm-core:jar")
    from({
        zipTree(project(":msm-core").tasks.named("jar").get().archiveFile.get().asFile)
    }) {
        exclude "META-INF/**"
    }
}

tasks.register("verifyBundledCore") {
    dependsOn tasks.named("remapJar")
    doLast {
        def remappedJar = tasks.named("remapJar").get().archiveFile.get().asFile
        def requiredClasses = [
            "dev/cylox/msm/profile/SessionProfile.class",
            "dev/cylox/msm/profile/SessionProfileStore.class",
            "dev/cylox/msm/profile/SessionAuthMode.class",
            "dev/cylox/msm/session/SessionManager.class",
            "dev/cylox/msm/session/SessionState.class"
        ]
        def archive = new java.util.zip.ZipFile(remappedJar)
        try {
            def missing = requiredClasses.findAll { archive.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException("MSM-Core classes are missing: ${missing.join(', ')}")
            }
            def nestedJars = []
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.name.startsWith("META-INF/jars/") && entry.name.endsWith(".jar")) {
                    nestedJars.add(entry.name.toLowerCase(java.util.Locale.ROOT))
                }
            }
            ["mcprotocollib", "nbt", "minecraftauth", "adventure", "opennbt"].each { library ->
                if (!nestedJars.any { it.contains(library) }) {
                    throw new GradleException("Required nested library is missing: ${library}")
                }
            }
            if (nestedJars.any { it.contains("netty-all") }) {
                throw new GradleException("Do not bundle Netty; Minecraft supplies the runtime transport.")
            }
        } finally {
            archive.close()
        }
    }
}

project(":msm-core") {
    tasks.named("test") {
        enabled = false
    }
}

tasks.register("verifyAutomationStore", JavaExec) {
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.cylox.msm.automation.SessionAutomationStoreTest"
}

tasks.register("verifyAutomationScheduler", JavaExec) {
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.cylox.msm.automation.SessionAutomationSchedulerTest"
}

check.dependsOn(":msm-core:check")
check.dependsOn("verifyBundledCore")
check.dependsOn("verifyAutomationStore")
check.dependsOn("verifyAutomationScheduler")
