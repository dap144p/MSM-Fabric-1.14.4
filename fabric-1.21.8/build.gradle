plugins {
    id "fabric-loom" version "1.10.5"
}

group = project.maven_group
version = project.findProperty("build_version") ?: project.mod_version

base {
    archivesName = "MSM-Fabric"
}

tasks.named("remapJar") {
    archiveFileName.set("MSM-Fabric-${project.version}-1.21.8.jar")
}

repositories {
    mavenCentral()
    maven {
        name = "opencollab"
        url = "https://repo.opencollab.dev/maven-releases/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

loom {
    mixin {
        defaultRefmapName = "msm_fabric.refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:" + project.minecraft_version
    mappings "net.fabricmc:yarn:" + project.yarn_mappings + ":v2"
    modImplementation "net.fabricmc:fabric-loader:" + project.loader_version
    modImplementation "net.fabricmc.fabric-api:fabric-api:" + project.fabric_api_version
    modCompileOnly "com.terraformersmc:modmenu:15.0.2"

    implementation project(":msm-core")

    // MC 1.21.7 and 1.21.8 share protocol 772.
    include(implementation("org.geysermc.mcprotocollib:protocol:1.21.7-1") {
        exclude group: "io.netty"
        exclude group: "org.slf4j"
    })
    include(implementation("org.cloudburstmc:nbt:3.0.0.Final"))
    include(implementation("com.google.code.gson:gson:2.11.0"))
    include(implementation("net.raphimc:MinecraftAuth:4.1.1"))
    include(implementation("net.kyori:adventure-api:4.17.0"))
    include(implementation("net.kyori:adventure-key:4.17.0"))
    include(implementation("net.kyori:adventure-nbt:4.17.0"))
    include(implementation("net.kyori:adventure-text-serializer-gson:4.17.0"))
    include(implementation("net.kyori:adventure-text-serializer-json:4.17.0"))
    include(implementation("net.kyori:adventure-text-serializer-json-legacy-impl:4.17.0"))
    include(implementation("net.kyori:option:1.0.0"))
    include(implementation("net.kyori:adventure-text-serializer-plain:4.17.0"))
    include(implementation("net.kyori:examination-api:1.3.0"))
    include(implementation("net.kyori:examination-string:1.3.0"))
    include(implementation("org.cloudburstmc.math:api:2.0"))
    include(implementation("org.cloudburstmc.math:immutable:2.0"))
    include(implementation("com.nukkitx.fastutil:fastutil-object-int-maps:8.5.3"))
    include(implementation("com.nukkitx.fastutil:fastutil-int-object-maps:8.5.3"))
    include(implementation("com.nukkitx.fastutil:fastutil-int-int-maps:8.5.3"))
    include(implementation("org.checkerframework:checker-qual:3.42.0"))
}

sourceSets {
    main {
        java {
            srcDir "../src/main/java/dev/cylox/msm/automation"
            srcDir "../src/main/java/dev/cylox/msm/update"
            srcDir "../src/main/java/dev/cylox/msm/config"
        }
    }
    test {
        java {
            srcDir "../src/test/java/dev/cylox/msm/automation"
            srcDir "../src/test/java/dev/cylox/msm/config"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

tasks.jar {
    dependsOn(":msm-core:jar")
    from({
        zipTree(project(":msm-core").tasks.named("jar").get().archiveFile.get().asFile)
    }) {
        exclude "META-INF/**"
    }
}

tasks.register("verifyBundledCore") {
    dependsOn tasks.named("remapJar")
    doLast {
        def archive = new java.util.zip.ZipFile(tasks.named("remapJar").get().archiveFile.get().asFile)
        try {
            [
                "dev/cylox/msm/profile/SessionProfile.class",
                "dev/cylox/msm/profile/SessionProfileStore.class",
                "dev/cylox/msm/session/SessionManager.class",
                "dev/cylox/msm/automation/SessionAutomationScheduler.class",
                "dev/cylox/msm/automation/SessionAutomationStore.class",
                "dev/cylox/msm/network/SecondarySessionController.class",
                "dev/cylox/msm/screen/SessionManagerScreen.class",
                "dev/cylox/msm/screen/SessionControlScreen.class",
                "dev/cylox/msm/update/MsmUpdateManager.class",
                "dev/cylox/msm/screen/MsmUpdateScreen.class"
            ].each { classPath ->
                if (archive.getEntry(classPath) == null) {
                    throw new GradleException("Required MSM class is missing: " + classPath)
                }
            }

            def entries = archive.entries()
            def nested = []
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.name.startsWith("META-INF/jars/") && entry.name.endsWith(".jar")) {
                    nested.add(entry.name.toLowerCase(java.util.Locale.ROOT))
                }
            }
            [
                "protocol-1.21.7-1",
                "nbt",
                "minecraftauth",
                "adventure",
                "adventure-text-serializer-json-4.17.0",
                "adventure-nbt-4.17.0",
                "option-1.0.0",
                "checker-qual"
            ].each { library ->
                if (!nested.any { it.contains(library) }) {
                    throw new GradleException("Required nested library is missing: " + library)
                }
            }

            def serializerEntry = archive.getEntry(
                    "META-INF/jars/adventure-text-serializer-json-4.17.0.jar")
            if (serializerEntry == null) {
                throw new GradleException("Adventure JSON serializer API is not bundled.")
            }
            def serializerJar = new java.util.jar.JarInputStream(archive.getInputStream(serializerEntry))
            try {
                boolean serializerClassFound = false
                def nestedEntry
                while ((nestedEntry = serializerJar.nextJarEntry) != null) {
                    if (nestedEntry.name == "net/kyori/adventure/text/serializer/json/JSONComponentSerializer.class") {
                        serializerClassFound = true
                        break
                    }
                }
                if (!serializerClassFound) {
                    throw new GradleException("JSONComponentSerializer.class is missing from the bundled serializer API.")
                }
            } finally {
                serializerJar.close()
            }

            def adventureNbtEntry = archive.getEntry("META-INF/jars/adventure-nbt-4.17.0.jar")
            if (adventureNbtEntry == null) {
                throw new GradleException("Adventure NBT library is not bundled.")
            }
            def adventureNbtJar = new java.util.jar.JarInputStream(archive.getInputStream(adventureNbtEntry))
            try {
                boolean tagStringIoFound = false
                def nbtEntry
                while ((nbtEntry = adventureNbtJar.nextJarEntry) != null) {
                    if (nbtEntry.name == "net/kyori/adventure/nbt/TagStringIO.class") {
                        tagStringIoFound = true
                        break
                    }
                }
                if (!tagStringIoFound) {
                    throw new GradleException("TagStringIO.class is missing from the bundled Adventure NBT library.")
                }
            } finally {
                adventureNbtJar.close()
            }

            if (nested.any { it.contains("netty") || it.contains("slf4j-api") }) {
                throw new GradleException("Do not bundle Netty; use the Minecraft runtime library.")
            }
        } finally {
            archive.close()
        }
    }
}

tasks.register("verifyAutomationStore", JavaExec) {
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.cylox.msm.automation.SessionAutomationStoreTest"
}

tasks.register("verifyAutomationScheduler", JavaExec) {
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.cylox.msm.automation.SessionAutomationSchedulerTest"
}

tasks.register("verifyNetworkStore", JavaExec) {
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.cylox.msm.config.SessionNetworkStoreTest"
}

check.dependsOn ":msm-core:check"
check.dependsOn "verifyBundledCore"
check.dependsOn "verifyAutomationStore"
check.dependsOn "verifyAutomationScheduler"
check.dependsOn "verifyNetworkStore"
