name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and build
        run: chmod +x gradlew && ./gradlew clean check build
      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: MSM-Fabric-1.14.4-${{ github.sha }}
          path: build/libs/*.jar
