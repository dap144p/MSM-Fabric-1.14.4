name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and build
        run: chmod +x gradlew && ./gradlew clean check build
      - name: Upload PR test JAR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MSM-Fabric-1.14.4-pr-${{ github.event.pull_request.number }}
          path: build/libs/MSM-Fabric-1.14.4-0.1.2.jar
          if-no-files-found: error
          retention-days: 7
      - name: Publish single JAR Beta release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2-beta.${{ github.run_number }}
          name: MSM Fabric 1.14.4 v0.1.2-beta.${{ github.run_number }}
          target_commitish: main
          files: build/libs/MSM-Fabric-1.14.4-0.1.2.jar
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: true
          make_latest: false
          body: |
            MSM Fabric 1.14.4 — Beta Test

            Build: #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download the single JAR asset and place it in your Minecraft `mods` folder.
            Requires Fabric Loader and Fabric API for Minecraft 1.14.4.

            This build adds independent secondary Java 1.14.4 protocol sessions for OFFLINE_LOCAL profiles,
            including Join Game status detection and per-session chat. It does not implement Microsoft
            authentication, secondary protocol translation, inventory control, or world rendering.
