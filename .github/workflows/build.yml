name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and build
        run: chmod +x gradlew && ./gradlew clean check build
      - name: Publish single JAR Beta release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2-beta.${{ github.run_number }}
          name: MSM Fabric 1.14.4 v0.1.2-beta.${{ github.run_number }}
          target_commitish: main
          files: build/libs/MSM-Fabric-1.14.4-0.1.2.jar
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: true
          make_latest: false
          body: |
            MSM Fabric 1.14.4 — Beta Test

            Build: #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download the single JAR asset and place it in your Minecraft `mods` folder.
            Requires Fabric Loader and Fabric API for Minecraft 1.14.4.

            This beta adds independent packet-driven secondary sessions for profiles set to OFFLINE_LOCAL.
            It includes connect/disconnect, chat and commands, keep-alive, W/A/S/D movement, jump, sneak, and sprint.
            Use only with an offline-mode server you own or explicitly manage. Online-mode authentication requests are rejected.
            Microsoft sign-in and secondary Via protocol translation are not implemented.
