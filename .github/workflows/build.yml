name: Build MSM Fabric

on:
  push:
    branches: [main, development, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, development, "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Determine build channel and version
        id: meta
        shell: bash
        run: |
          BASE_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | sed 's/-dev$//')"
          if [[ -z "$BASE_VERSION" ]]; then
            echo "mod_version is missing from gradle.properties"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              CHANNEL="beta"
            elif [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              CHANNEL="rc"
            elif [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              CHANNEL="stable"
            else
              echo "Unsupported release tag: $GITHUB_REF_NAME"
              echo "Use vX.Y.Z-beta.N, vX.Y.Z-rc.N, or vX.Y.Z."
              exit 1
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/development" ]]; then
            CHANNEL="nightly"
            BUILD_VERSION="${BASE_VERSION}-nightly.${GITHUB_RUN_NUMBER}"
          else
            CHANNEL="development"
            BUILD_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building channel=$CHANNEL version=$BUILD_VERSION"

      - name: Verify and build Minecraft 1.14.4
        run: |
          chmod +x gradlew
          ./gradlew "-Pbuild_version=${{ steps.meta.outputs.build_version }}" clean check build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and build Minecraft 1.21.8
        working-directory: fabric-1.21.8
        run: |
          chmod +x gradlew
          ./gradlew "-Pbuild_version=${{ steps.meta.outputs.build_version }}" clean check build

      - name: Generate SHA-256 checksum assets
        shell: bash
        run: |
          sha256sum "build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar" | awk '{print $1}' > "build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar.sha256"
          sha256sum "fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar" | awk '{print $1}' > "fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar.sha256"

      - name: Upload Minecraft 1.14.4 Development JAR
        if: steps.meta.outputs.channel == 'development' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4
          path: |
            build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar
            build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Minecraft 1.21.8 Development JAR
        if: steps.meta.outputs.channel == 'development' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8
          path: |
            fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar
            fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish MSM Nightly prerelease
        if: steps.meta.outputs.channel == 'nightly' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}-${{ github.run_attempt }}
          name: "Multi Sessions Manager (MSM) Nightly #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar
            build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar.sha256
            fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar
            fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar.sha256
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          body: |
            Multi Sessions Manager (MSM) — Nightly Development Build

            Version: ${{ steps.meta.outputs.build_version }}
            Commit: ${{ github.sha }}

            This release provides two separate mod JAR downloads:
            - MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar — Minecraft 1.14.4 (Java 8).
            - MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar — Minecraft 1.21.8 (Java 21).

            Install only the JAR matching the Minecraft profile. The two JARs are not interchangeable.
            This is a development snapshot and may contain regressions. It is not a Beta or Stable release.

      - name: Publish versioned Beta, RC, or Stable release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Multi Sessions Manager (MSM) ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar
            build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar.sha256
            fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar
            fabric-1.21.8/build/libs/MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ steps.meta.outputs.channel != 'stable' }}
          make_latest: ${{ steps.meta.outputs.channel == 'stable' }}
          generate_release_notes: true
          body: |
            Multi Sessions Manager (MSM) — ${{ steps.meta.outputs.channel }} release

            Version: ${{ steps.meta.outputs.build_version }}
            Commit: ${{ github.sha }}

            The release provides exactly two separate single-JAR downloads:
            - MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.14.4.jar — Minecraft 1.14.4 Fabric profile (Java 8 runtime).
            - MSM-Fabric-${{ steps.meta.outputs.build_version }}-1.21.8.jar — Minecraft 1.21.8 Fabric profile (Java 21 runtime).

            Each JAR requires Fabric Loader and Fabric API compatible with its Minecraft version. No combined ZIP is published.
