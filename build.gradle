plugins {
    id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    mixin {
        defaultRefmapName = "msm_fabric.refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(":msm-core")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

tasks.named("jar") {
    dependsOn(":msm-core:jar")
    from({
        zipTree(project(":msm-core").tasks.named("jar").get().archiveFile.get().asFile)
    }) {
        exclude "META-INF/**"
    }
}

tasks.register("verifyBundledCore") {
    dependsOn tasks.named("remapJar")

    doLast {
        def remappedJar = tasks.named("remapJar").get().archiveFile.get().asFile
        def requiredClasses = [
                "dev/cylox/msm/profile/SessionProfile.class",
                "dev/cylox/msm/profile/SessionProfileStore.class",
                "dev/cylox/msm/session/SessionManager.class",
                "dev/cylox/msm/session/SessionState.class"
        ]
        def missingClasses = []
        def archive = new java.util.zip.ZipFile(remappedJar)

        try {
            requiredClasses.each { classPath ->
                if (archive.getEntry(classPath) == null) {
                    missingClasses.add(classPath)
                }
            }
        } finally {
            archive.close()
        }

        if (!missingClasses.isEmpty()) {
            throw new GradleException(
                    "MSM-Core classes are missing from ${remappedJar.name}: ${missingClasses.join(', ')}")
        }
    }
}

check.dependsOn ":msm-core:check"
check.dependsOn "verifyBundledCore"
